<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fasilitas dan Tempat - Ajwad Resto</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    header h1 {
      font-size: 2rem;
      color: #2c3e50;
      margin-bottom: 8px;
    }
    header p {
      color: #666;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
    }
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
    .card-title {
      padding: 12px 16px;
      font-weight: 600;
      font-size: 1rem;
      color: #2c3e50;
    }
  </style>
</head>
<body>

  <header>
    <h1>Ajwad Resto</h1>
    <p>Fasilitas dan Pilihan Tempat</p>
  </header>

  <main class="gallery">
    <div class="card">
      <img src="Lantai 2.png" alt="Lantai 2">
      <div class="card-title">Lantai 2</div>
    </div>
    <div class="card">
      <img src="Lesehan Lantai 2.jpg" alt="Lesehan Lantai 2">
      <div class="card-title">Lesehan Lantai 2</div>
    </div>
    <div class="card">
      <img src="Lesehan-Lantai 1 .jpeg" alt="Lesehan Lantai 1">
      <div class="card-title">Lesehan Lantai 1</div>
    </div>
    <div class="card">
      <img src="lESEHAN LT2.jpg" alt="Lesehan Lantai 2">
      <div class="card-title">Lesehan Lantai 2 (Sudut Lain)</div>
    </div>
    <div class="card">
      <img src="VIP 1.jpeg" alt="VIP 1">
      <div class="card-title">Ruang VIP 1</div>
    </div>
    <div class="card">
      <img src="VIP 2.jpeg" alt="VIP 2">
      <div class="card-title">Ruang VIP 2</div>
    </div>
    <div class="card">
      <img src="VIP 3.jpeg" alt="VIP 3">
      <div class="card-title">Ruang VIP 3</div>
    </div>
    <div class="card">
      <img src="VIP3.jpg" alt="VIP 3 Lainnya">
      <div class="card-title">Ruang VIP 3 (Sudut Lain)</div>
    </div>
    <div class="card">
      <img src="VIP 4.jpeg" alt="VIP 4">
      <div class="card-title">Ruang VIP 4</div>
    </div>
    <div class="card">
      <img src="VIP4.jpg" alt="VIP 4 Lainnya">
      <div class="card-title">Ruang VIP 4 (Sudut Lain)</div>
    </div>
    <div class="card">
      <img src="VIP4..jpg" alt="VIP 4 Detail">
      <div class="card-title">Ruang VIP 4 (Detail)</div>
    </div>
    <div class="card">
      <img src="image.png" alt="Fasilitas Lainnya">
      <div class="card-title">Fasilitas Lainnya</div>
    </div>
  </main>

</body>
</html>
