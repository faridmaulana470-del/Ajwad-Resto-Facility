<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fasilitas dan Tempat - Ajwad Resto</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    header h1 {
      font-size: 2rem;
      color: #2c3e50;
      margin-bottom: 8px;
    }
    header p {
      color: #666;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
    }
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
    .card-title {
      padding: 12px 16px;
      font-weight: 600;
      font-size: 1rem;
      color: #2c3e50;
    }

    /* Lightbox / Modal Preview */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox img {
      max-width: 92vw;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .lightbox-caption {
      color: #fff;
      margin-top: 14px;
      font-size: 1.1rem;
      font-weight: 500;
      text-align: center;
    }
    .lightbox-close {
      position: absolute;
      top: 18px;
      right: 26px;
      color: #fff;
      font-size: 2.2rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      line-height: 1;
    }
    .lightbox-close:hover {
      color: #ccc;
    }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: none;
      font-size: 1.8rem;
      padding: 12px 16px;
      cursor: pointer;
      border-radius: 8px;
      user-select: none;
      transition: background 0.2s;
    }
    .lightbox-nav:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .lightbox-prev { left: 16px; }
    .lightbox-next { right: 16px; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Ajwad Resto</h1>
    <p>Fasilitas dan Pilihan Tempat (Klik foto untuk memperbesar)</p>
  </header>

  <main class="gallery">
    <div class="card">
      <img src="Lantai 2.png" alt="Lantai 2">
      <div class="card-title">Lantai 2</div>
    </div>
    <div class="card">
      <img src="Lesehan Lantai 2.jpg" alt="Lesehan Lantai 2">
      <div class="card-title">Lesehan Lantai 2</div>
    </div>
    <div class="card">
      <img src="Lesehan-Lantai 1 .jpeg" alt="Lesehan Lantai 1">
      <div class="card-title">Lesehan Lantai 1</div>
    </div>
    <div class="card">
      <img src="lESEHAN LT2.jpg" alt="Lesehan Lantai 2 (Sudut Lain)">
      <div class="card-title">Lesehan Lantai 2 (Sudut Lain)</div>
    </div>
    <div class="card">
      <img src="VIP 1.jpeg" alt="Ruang VIP 1">
      <div class="card-title">Ruang VIP 1</div>
    </div>
    <div class="card">
      <img src="VIP 2.jpeg" alt="Ruang VIP 2">
      <div class="card-title">Ruang VIP 2</div>
    </div>
    <div class="card">
      <img src="VIP 3.jpeg" alt="Ruang VIP 3">
      <div class="card-title">Ruang VIP 3</div>
    </div>
